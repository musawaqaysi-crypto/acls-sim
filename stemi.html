<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>STEMI Pathway Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout: monitor with the pathway clock and ECG on one side, the decision card and the RCC timeline on the other; the pathway flow sits under the monitor. One column on a phone, card straight after the monitor. */
:root {
  color-scheme: dark;
  --bg: #0c0e14;
  --panel: #141822;
  --screen: #07090d;
  --line: #262c3a;
  --fg: #e8eaf0;
  --muted: #8e96a8;
  --ecg: #45e08a;
  --accent: #ff5468;
  --teal: #2ec4b6;
  --sky: #5bb8f5;
  --gold: #f2c230;
  --ok: #45e08a;
  --bad: #ff5468;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Arabic", "IBM Plex Sans", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
}
:root[lang="ar"] { --font-display: "IBM Plex Sans Arabic", "Geeza Pro", Arial, sans-serif; --font-body: "IBM Plex Sans Arabic", "Geeza Pro", Arial, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.65; }
.app {
  max-width: 1160px; margin: 0 auto; padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr);
}
.app > * { min-width: 0; }
@media (min-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "mon card" "flow card" "flow log"; grid-template-rows: auto auto 1fr; align-items: start; }
  .mon { grid-area: mon; } .card { grid-area: card; } .flow { grid-area: flow; } .sheet { grid-area: log; }
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* Monitor */
.mon { background: var(--screen); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.m-top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.m-top b { color: var(--fg); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: 6px; direction: ltr; unicode-bidi: isolate; }
#myo.g { color: var(--ok); } #myo.a { color: var(--gold); } #myo.r { color: var(--bad); }
.lang { font: 600 13px var(--font-body); color: var(--screen); background: var(--accent); border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.lang:hover { filter: brightness(1.1); }
.pt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.pt i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; animation: beat 0.8s infinite; }
@keyframes beat { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 30% { transform: scale(1.25); opacity: 1; } }
.pt.idle i { background: var(--muted); animation: none; } .pt.idle { color: var(--muted); }
.vit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.v { padding: 6px 10px; border-inline-end: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
.v:last-child { border-inline-end: 0; }
.v span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v b { font-family: var(--font-data); font-size: 20px; font-weight: 600; line-height: 1.15; direction: ltr; unicode-bidi: isolate; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v.hr b { color: var(--ecg); } .v.bp b { color: var(--fg); } .v.sp b { color: var(--sky); } .v.rh b { color: var(--gold); font-size: 15px; }
.ecg { padding: 6px 8px 8px; border-bottom: 1px solid var(--line); background-image: linear-gradient(rgba(255,84,104,0.10) 1px, transparent 1px), linear-gradient(90deg, rgba(255,84,104,0.10) 1px, transparent 1px); background-size: 12px 12px; }
.ecg svg { width: 100%; height: auto; display: block; direction: ltr; }
.ecg path { fill: none; stroke: var(--ecg); stroke-width: 1.6; stroke-linejoin: round; }
.ecg text { fill: var(--muted); font: 600 11px var(--font-data); }
.ecg .none { fill: var(--muted); font: 500 13px var(--font-body); }
.ms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.mi { padding: 8px 10px; border-inline-end: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mi:last-child { border-inline-end: 0; }
.mi span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi b { font-family: var(--font-data); font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--muted); direction: ltr; unicode-bidi: isolate; text-align: start; }
.mi small { font-family: var(--font-data); font-size: 11px; color: var(--muted); direction: ltr; unicode-bidi: isolate; text-align: start; }
.mi.ok b { color: var(--ok); } .mi.late b { color: var(--bad); }
.mi.bump b { animation: bump 0.5s ease-out; }
@keyframes bump { 40% { transform: scale(1.3); } }
@media (max-width: 520px) { .v, .mi { padding: 6px 6px; } .v b, .mi b { font-size: 16px; } .v.rh b { font-size: 12px; } }

/* Pathway flow */
.flow { padding: 14px 16px 16px; display: grid; gap: 12px; }
.f-head { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: baseline; }
.f-head span { font-size: 12px; color: var(--muted); }
.steps-flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.node { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--screen); transition: border-color 0.3s, background 0.3s; }
.node .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--font-data); background: var(--line); color: var(--muted); }
.node b { font-family: var(--font-display); font-weight: 600; display: block; }
.node span { font-size: 13.5px; color: var(--muted); }
.node.on { border-color: var(--accent); background: rgba(255,84,104,0.08); }
.node.on .ic { background: var(--accent); color: var(--screen); }
.node.done .ic { background: var(--teal); color: var(--screen); }
.node.lysis { border-style: dashed; }
.arrow { text-align: center; color: var(--muted); font-size: 12px; line-height: 1; }
.targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tg b { font-family: var(--font-data); font-size: 18px; color: var(--gold); direction: ltr; unicode-bidi: isolate; display: block; text-align: start; }
.tg span { font-size: 12.5px; color: var(--muted); }

/* Timeline */
.sheet { padding: 12px 16px; }
.sheet h2 { color: var(--muted); margin-bottom: 6px; }
.sheet ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sheet li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.sheet li.sep { display: block; color: var(--accent); font-weight: 600; font-size: 13px; padding-top: 4px; }
.sheet time { font-family: var(--font-data); color: var(--gold); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; text-align: start; }
.sheet li.empty { display: block; color: var(--muted); }

/* Decision card */
.card { padding: 20px; display: grid; gap: 14px; }
.steps { display: flex; gap: 6px; align-items: center; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.done { background: var(--ok); } .steps i.miss { background: var(--bad); } .steps i.now { background: var(--accent); }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.25; margin: 0; text-wrap: balance; }
.story { margin: 0; max-width: 62ch; }
.q { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 4px 0 0; color: var(--accent); text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { font: inherit; color: var(--fg); text-align: start; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; line-height: 1.55; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .go:focus-visible, .lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; opacity: 0.55; }
.opt.wrong { border-color: var(--bad); opacity: 0.8; text-decoration: line-through; text-decoration-color: var(--bad); }
.fb { border-radius: 8px; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line); }
.fb strong { display: block; font-family: var(--font-display); font-size: 16px; margin-bottom: 2px; }
.fb.ok strong { color: var(--ok); } .fb.no strong { color: var(--bad); }
.fb ul { margin: 6px 0 0; padding-inline-start: 20px; }
.go { font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--screen); background: var(--accent); border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer; justify-self: start; }
.go:hover { filter: brightness(1.1); }
.score { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.score div { display: flex; flex-direction: column; }
.score b { font-family: var(--font-data); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; text-align: start; }
.score span { font-size: 13px; color: var(--muted); max-width: 22ch; }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.review li { display: flex; gap: 10px; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.review .y { color: var(--ok); } .review .n { color: var(--bad); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.card.is-ok { border-color: var(--ok); }
.card.is-no { border-color: var(--bad); animation: shake 0.35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
.verdict { display: flex; gap: 14px; align-items: center; }
.stamp { width: 60px; height: 60px; flex: none; animation: pop 0.35s ease-out; }
.stamp circle { fill: none; stroke: currentColor; stroke-width: 3; }
.stamp path { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.stamp.ok { color: var(--ok); } .stamp.no { color: var(--bad); }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
.chose { margin: 0; color: var(--muted); font-size: 14px; }
.is-ok .score b { color: var(--ok); } .is-no .score b { color: var(--bad); }
.sig { grid-column: 1 / -1; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: 0.04em; padding-top: 8px; direction: ltr; }
.sig b { font-family: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive; font-weight: 400; font-size: 30px; letter-spacing: 0; color: var(--fg); margin-left: 6px; vertical-align: middle; }
@media (prefers-reduced-motion: reduce) { .pt i, .stamp, .card.is-no, .mi.bump b { animation: none; } }
</style>

<div class="app">
  <div class="mon" aria-live="polite">
    <div class="m-top">
      <span><span data-t="clockL"></span><b id="clock">--</b></span>
      <span><span data-t="myoL"></span><b id="myo" class="g">100%</b></span>
      <button class="lang" id="langBtn" type="button">English</button>
    </div>
    <div class="pt idle" id="pt"><i></i><span id="ptTxt"></span></div>
    <div class="vit">
      <div class="v hr"><span data-t="hrL"></span><b id="vHr">--</b></div>
      <div class="v bp"><span data-t="bpL"></span><b id="vBp">--/--</b></div>
      <div class="v sp"><span data-t="spL"></span><b id="vSp">--</b></div>
      <div class="v rh"><span data-t="rhL"></span><b id="vRh">--</b></div>
    </div>
    <div class="ecg"><svg id="ecg" viewBox="0 0 600 150" role="img"></svg></div>
    <div class="ms">
      <div class="mi" id="m-ecg"><span data-t="mEcg"></span><b>--</b><small>≤ 10</small></div>
      <div class="mi" id="m-rcc"><span data-t="mRcc"></span><b>--</b><small>&nbsp;</small></div>
      <div class="mi" id="m-dec"><span data-t="mDec"></span><b>--</b><small>&nbsp;</small></div>
      <div class="mi" id="m-out"><span id="mOutL"></span><b>--</b><small>≤ 30</small></div>
    </div>
  </div>

  <div class="card panel" id="card"></div>

  <section class="flow panel">
    <div class="f-head"><h2 data-t="flowH"></h2><span data-t="flowNote"></span></div>
    <ol class="steps-flow" id="flowList"></ol>
    <div class="targets" id="targets"></div>
  </section>

  <section class="sheet panel">
    <h2 data-t="logH"></h2>
    <ol id="log"></ol>
  </section>

  <footer class="sig">Designed by <b>Dr. Musawa</b></footer>
</div>

<script>
/* Every string has an Arabic and an English version; L() picks the active one. */
let LANG = 'ar';
try { const s = localStorage.getItem('stemi-lang'); if (s === 'en' || s === 'ar') LANG = s; } catch (e) {}
const L = (o) => (typeof o === 'string' ? o : o[LANG]);

const UI = {
  clockL: { ar: 'منذ الوصول', en: 'DOOR +' },
  myoL: { ar: 'عضلة القلب', en: 'MYOCARDIUM' },
  hrL: { ar: 'النبض', en: 'HR bpm' },
  bpL: { ar: 'الضغط', en: 'BP mmHg' },
  spL: { ar: 'الأكسجين %', en: 'SpO2 %' },
  rhL: { ar: 'النظم', en: 'Rhythm' },
  mEcg: { ar: 'التخطيط (د)', en: 'Door→ECG (min)' },
  mRcc: { ar: 'اتصال RCC (د)', en: 'Door→RCC (min)' },
  mDec: { ar: 'القرار (د)', en: 'Decision (min)' },
  mOutPci: { ar: 'الخروج (د)', en: 'Door-out (min)' },
  mOutLysis: { ar: 'الإذابة (د)', en: 'Door→needle (min)' },
  flowH: { ar: 'مسار STEMI مع RCC', en: 'STEMI pathway with RCC' },
  flowNote: { ar: 'تجمع جازان الصحي', en: 'Jazan Health Cluster' },
  logH: { ar: 'الخط الزمني (توثيق RCC)', en: 'Timeline (RCC documentation)' },
  logEmpty: { ar: 'كل خطوة تُسجَّل هنا بوقتها من لحظة الوصول.', en: 'Every step is logged here, timed from arrival.' },
  idle: { ar: 'لا يوجد مريض', en: 'No patient yet' },
  min: { ar: 'د', en: 'min' },
  decision: { ar: 'القرار', en: 'Decision' },
  of: { ar: 'من', en: 'of' },
  yourCall: { ar: 'قرارك: ', en: 'Your call: ' },
  wrong: { ar: 'قرار خاطئ', en: 'Wrong call' },
  right: { ar: 'قرار صحيح', en: 'Right call' },
  rightFirst: { ar: 'قرار صحيح من أول مرة', en: 'Right call, first time' },
  lost: { ar: 'دقائق ضاعت، وعضلة القلب تموت', en: 'minutes lost while muscle dies' },
  myoLeft: { ar: 'عضلة القلب المُنقَذة', en: 'myocardium saved' },
  whyNo: { ar: 'لماذا هذا خطأ', en: 'Why it fails' },
  whyOk: { ar: 'لماذا هذا صحيح', en: 'Why it works' },
  back: { ar: 'ارجع للقرار', en: 'Back to the decision' },
  next: { ar: 'القرار التالي', en: 'Next decision' },
  debrief: { ar: 'اعرض التقييم', en: 'Show my debrief' },
  logged: { ar: 'من الوصول، مسجّل', en: 'from arrival, logged' },
  start: { ar: 'ابدأ اللعبة', en: 'Start the game' },
  again: { ar: 'العب مرة ثانية', en: 'Play again' },
  firstCall: { ar: 'من أول مرة', en: 'first call' },
  wrongN: { ar: (n) => n + (n > 1 ? ' قرارات خاطئة' : ' قرار خاطئ'), en: (n) => n + ' wrong ' + (n > 1 ? 'calls' : 'call') },
};

const PATIENTS = {
  1: { ar: 'المريض الأول · رجل 58 سنة · ألم صدر منذ ساعتين', en: 'Patient 1 · man, 58 · chest pain for 2 hours' },
  2: { ar: 'المريض الثاني · رجل 46 سنة · ألم صدر منذ 90 دقيقة', en: 'Patient 2 · man, 46 · chest pain for 90 minutes' },
};

const FLOW = [
  ['ed', 'ED', { ar: 'الطوارئ', en: 'Emergency Department' }, { ar: 'تثبيت الحالة، تخطيط، تحاليل، وإذابة إذا أوصى RCC.', en: 'Stabilise, ECG, labs; thrombolysis if advised by RCC.' }],
  ['coord', 'RC', { ar: 'منسق RCC', en: 'RCC Coordinator' }, { ar: 'يستقبل الاتصال، يربط الاستشاري المناوب، يبلغ الإسعاف والمركز المستقبِل.', en: 'Takes the call, connects the on-call consultant, informs the ambulance and the receiving center.' }],
  ['cons', 'Dr', { ar: 'استشاري RCC', en: 'RCC Consultant' }, { ar: 'يحدد STEMI أو لا، وقسطرة أولية أو إذابة.', en: 'Decides STEMI or not, and primary PCI or thrombolysis.' }],
  ['acc', '✓', { ar: 'القبول', en: 'Accepted' }, { ar: 'النقل عبر مركز النقل، والطوارئ تجهز فريق النقل.', en: 'Transport via the Transportation Center; the ED prepares the transfer team.' }],
  ['center', 'PCI', { ar: 'المركز المختص', en: 'Specialized Center' }, { ar: 'مباشرة إلى غرفة القسطرة (PPCI).', en: 'Direct to the cath lab (PPCI).' }],
];
const TARGETS = [
  ['≤ 10 min', { ar: 'من الوصول إلى أول تخطيط', en: 'arrival to first 12-lead ECG' }],
  ['≤ 120 min', { ar: 'من التشخيص إلى القسطرة، وإلا فالإذابة', en: 'diagnosis to PCI, or else thrombolysis' }],
  ['≤ 30 min', { ar: 'من الدخول إلى الخروج للقسطرة', en: 'door-in-door-out for transfer' }],
  ['≤ 30 min', { ar: 'من الوصول إلى بدء الإذابة', en: 'door-to-needle for thrombolysis' }],
];

/* ECG strips: each lead is a few beats with an ST offset (px, up is positive) */
const ECGS = {
  inf: [['II', 14], ['III', 16], ['aVF', 15], ['aVL', -7]],
  ant: [['V1', 10], ['V2', 18], ['V3', 17], ['V4', 13]],
  rv: [['V4R', 7], ['V1', 4], ['II', 14], ['aVL', -6]],
  aivr: 'aivr',
  sinus: [['II', 0], ['V2', 0], ['V3', 0], ['aVL', 0]],
};

const SCENES = [
  /* Patient 1: inferior STEMI to primary PCI */
  { pt: 1, t: 2, node: 'ed', v: ['96', '138/84', '97', { ar: 'جيبي', en: 'Sinus' }], ecg: null,
    title: { ar: 'عند الفرز', en: 'At triage' },
    story: { ar: 'رجل 58 سنة، مدخن وعنده سكري، دخل الطوارئ ماشياً. ألم ضاغط في الصدر منذ ساعتين يمتد للفك، مع تعرق. الانتظار مزدحم.', en: 'A 58-year-old man, a smoker with diabetes, walks into the ED. Two hours of pressing chest pain spreading to the jaw, with sweating. The waiting room is busy.' },
    q: { ar: 'ما أول خطوة؟', en: 'What is the first step?' },
    opts: [
      { x: { ar: 'يأخذ رقماً وينتظر دوره، فهو يمشي ومستقر.', en: 'He takes a number and waits his turn; he is walking and stable.' }, pen: 15,
        fb: { ar: 'ألم الصدر القلبي لا ينتظر في الصالة. المشي لا يعني الاستقرار، وكل دقيقة تأخير تعني عضلة قلب تموت.', en: 'Cardiac chest pain never waits in the waiting room. Walking does not mean stable, and every minute of delay is muscle lost.' } },
      { x: { ar: 'تخطيط قلب 12 اتجاهاً خلال 10 دقائق من الوصول، ويقرأه الطبيب فوراً.', en: 'A 12-lead ECG within 10 minutes of arrival, read by a physician at once.' }, ok: 1, ms: ['ecg', 7],
        log: { ar: 'تخطيط 12 اتجاهاً، قرأه الطبيب', en: '12-lead ECG done and read by physician' },

      { x: { ar: 'جلطة سفلية بارتفاع ST (STEMI) في II وIII وaVF، مع انخفاض مقابل في aVL.', en: 'Inferior STEMI: ST elevation in II, III and aVF, with reciprocal depression in aVL.' }, ok: 1,

        fb: { ar: 'ارتفاع ST في اتجاهين متجاورين مع انخفاض مقابل = STEMI، ومعالجته كـ NSTEMI تحرمه من فتح الشريان العاجل.', en: 'ST elevation in contiguous leads with reciprocal change is a STEMI. Treating it as NSTEMI denies him urgent reperfusion.' } },
      { x: { ar: 'تخطيط طبيعي مع إعادة استقطاب مبكرة.', en: 'A normal ECG with early repolarisation.' }, pen: 15,

    ] },

/* ECG drawing */
function beat(x, y, st, wide) {
  if (wide) return ' L' + (x + 8) + ' ' + y + ' L' + (x + 14) + ' ' + (y - 26) + ' L' + (x + 24) + ' ' + (y + 14) + ' L' + (x + 32) + ' ' + y + ' Q' + (x + 44) + ' ' + (y + 10) + ' ' + (x + 56) + ' ' + y;
  return ' L' + (x + 10) + ' ' + y + ' Q' + (x + 14) + ' ' + (y - 4) + ' ' + (x + 18) + ' ' + y + ' L' + (x + 22) + ' ' + y +
    ' L' + (x + 24) + ' ' + (y + 3) + ' L' + (x + 27) + ' ' + (y - 24) + ' L' + (x + 30) + ' ' + (y + 6) + ' L' + (x + 32) + ' ' + (y - st) +
    ' Q' + (x + 40) + ' ' + (y - st - 3) + ' ' + (x + 44) + ' ' + (y - st - 9 - Math.max(0, st) * 0.3) + ' Q' + (x + 49) + ' ' + (y - st * 0.3) + ' ' + (x + 54) + ' ' + y;
}
function drawEcg(kind) {
  const svg = $('ecg');
  if (!kind) {
    svg.innerHTML = '<text class="none" x="300" y="80" text-anchor="middle">' + L({ ar: 'لم يُعمل التخطيط بعد', en: 'No ECG yet' }) + '</text>';
    return;
  }
  if (kind === 'aivr') {
    let d = 'M4 80';
    for (let x = 4; x < 590; x += 82) d += beat(x, 80, 0, true) + ' L' + (x + 82) + ' 80';
    svg.innerHTML = '<text x="6" y="16">II · AIVR 72</text><path d="' + d + '"></path>';
    return;
  }
  const leads = ECGS[kind];
  svg.innerHTML = leads.map((l, k) => {
    const col = k % 2, row = Math.floor(k / 2), x0 = col * 300 + 6, y = 52 + row * 72;
    let d = 'M' + x0 + ' ' + y;
    for (let b = 0; b < 4; b++) { const x = x0 + 26 + b * 66; d += ' L' + x + ' ' + y + beat(x, y, l[1]); }
    d += ' L' + (x0 + 288) + ' ' + y;
    return '<text x="' + (x0 + 2) + '" y="' + (y - 28) + '">' + l[0] + '</text><path d="' + d + '"></path>';
  }).join('');
}
function setMon(sc) {
  S.v = sc.v; S.ecg = sc.ecg;
  $('vHr').textContent = sc.v[0]; $('vBp').textContent = sc.v[1]; $('vSp').textContent = sc.v[2]; $('vRh').textContent = L(sc.v[3]);

function drawMon() {
  if (S.v) { $('vHr').textContent = S.v[0]; $('vBp').textContent = S.v[1]; $('vSp').textContent = S.v[2]; $('vRh').textContent = L(S.v[3]); }
  else { $('vHr').textContent = '--'; $('vBp').textContent = '--/--'; $('vSp').textContent = '--'; $('vRh').textContent = '--'; }

  $('ptTxt').textContent = S.pt ? L(PATIENTS[S.pt]) : L(UI.idle);
  $('mOutL').textContent = L(S.lysis ? UI.mOutLysis : UI.mOutPci);
  ['ecg', 'rcc', 'dec', 'out'].forEach((k) => {

    el.classList.remove('ok', 'late');
    if (m !== undefined && TARGET[k]) el.classList.add(m <= TARGET[k] ? 'ok' : 'late');
    else if (m !== undefined) el.classList.add('ok');
  });
}
function setMs(k, m) {

}
function setClock(m) {

  $('clock').textContent = clockTxt(m);
  const c = myo(), el = $('myo');

function drawFlow() {
  const order = FLOW.map((f) => f[0]);
  const at = order.indexOf(S.node);
  let html = FLOW.map((f, k) => {
    const cls = S.node === f[0] ? ' on' : (at > k ? ' done' : '');

      : L(f[3]);
    return (k ? '<li class="arrow" aria-hidden="true">▼</li>' : '') +
      '<li class="node' + cls + (f[0] === 'ed' && S.lysis ? ' lysis' : '') + '"><span class="ic">' + f[1] + '</span><div><b>' + L(f[2]) + '</b><span>' + body + '</span></div></li>';
  }).join('');
  $('flowList').innerHTML = html;
  $('targets').innerHTML = TARGETS.map((t) => '<div class="tg"><b>' + t[0] + '</b><span>' + L(t[1]) + '</span></div>').join('');
}

}
function go(i) {
  S.i = i; S.tries = 0; S.tried = [];
  const sc = SCENES[i];
  if (sc.pt !== S.pt) {
    S.pt = sc.pt; S.ms = {}; S.lysis = 0;
    addLog({ sep: PATIENTS[sc.pt] });
    if (sc.pt === 2) setMs('ecg', 6);
  }
  if (sc.lysis) S.lysis = 1;
  S.node = sc.node;
  setMon(sc); setClock(sc.t); drawMon(); drawFlow();
  ask(i);
}
function ask(i) {
  S.view = 'ask';
  const sc = SCENES[i];
  card.className = 'card panel';
  card.innerHTML = stepsHtml() +
    '<span class="eyebrow">' + L(PATIENTS[sc.pt]).split(' · ')[0] + ' · ' + L(UI.decision) + ' ' + (i + 1) + ' ' + L(UI.of) + ' ' + SCENES.length + '</span>' +
    '<h1>' + L(sc.title) + '</h1><p class="story">' + L(sc.story) + '</p><p class="q">' + L(sc.q) + '</p>' +
    '<div class="opts">' + sc.opts.map((o, k) => {
      const used = S.tried.includes(k);
      return '<button class="opt' + (used ? ' wrong' : '') + '" type="button" id="opt-' + k + '"' + (used ? ' disabled' : '') + '>' + L(o.x) + '</button>';
    }).join('') + '</div>';
  sc.opts.forEach((o, k) => { $('opt-' + k).onclick = () => pick(i, k); });
}
/* Every choice gets its own verdict screen: what it cost, then why. */
function pick(i, k, redraw) {
  S.view = 'pick'; S.k = k;
  const sc = SCENES[i], o = sc.opts[k], last = i === SCENES.length - 1;
  const head = (kind, title) => stepsHtml() +
    '<div class="verdict">' + stamp(kind) + '<div><span class="eyebrow">' + L(UI.decision) + ' ' + (i + 1) + ' ' + L(UI.of) + ' ' + SCENES.length + ' · ' + L(sc.title) + '</span><h1>' + title + '</h1></div></div>' +
    '<p class="chose">' + L(UI.yourCall) + L(o.x) + '</p>';
  if (!o.ok) {
    if (!redraw) { S.tries++; S.tried.push(k); S.pen += o.pen; setClock(S.t); }
    card.className = 'card panel' + (redraw ? '' : ' is-no');
    card.innerHTML = head('no', L(UI.wrong)) +
      '<div class="score"><div><b>+' + o.pen + '</b><span>' + L(UI.lost) + '</span></div>' +
      '<div><b>' + myo() + '%</b><span>' + L(UI.myoLeft) + '</span></div></div>' +
      '<div class="fb no"><strong>' + L(UI.whyNo) + '</strong>' + L(o.fb) + '</div>' +
      '<button class="go" id="retryBtn" type="button">' + L(UI.back) + '</button>';
    $('retryBtn').onclick = () => ask(i);
    return;
  }
  if (!redraw) {
    S.res[i] = S.tries;
    /* a wrong call delays the milestone it belongs to */
    const late = sc.opts.filter((_, j) => S.tried.includes(j)).reduce((a, x) => a + x.pen, 0);
    if (o.ms) setMs(o.ms[0], o.ms[1] + late);
    if (o.ms2) setMs(o.ms2[0], o.ms2[1] + late);
    addLog({ m: sc.t + late, x: o.log });
  }
  card.className = 'card panel is-ok';
  card.innerHTML = head('ok', L(S.res[i] ? UI.right : UI.rightFirst)) +
    '<div class="score"><div><b>' + myo() + '%</b><span>' + L(UI.myoLeft) + '</span></div></div>' +
    '<div class="fb ok"><strong>' + L(UI.whyOk) + '</strong>' + L(o.fb) + '</div>' +
    '<button class="go" id="nextBtn" type="button">' + L(last ? UI.debrief : UI.next) + '</button>';
  $('nextBtn').onclick = () => (last ? finish() : go(i + 1));
}
function finish() {
  S.view = 'finish';
  const first = S.res.filter((r) => r === 0).length, pass = myo() >= 60;
  card.className = 'card panel ' + (pass ? 'is-ok' : 'is-no');
  card.innerHTML = stepsHtml() +
    '<div class="verdict">' + stamp(pass ? 'ok' : 'no') + '<div><span class="eyebrow">' + L({ ar: 'التقييم', en: 'Debrief' }) + '</span><h1>' +
      L(pass ? { ar: 'أنقذت عضلة القلب', en: 'Muscle saved' } : { ar: 'ضاع وقت كثير', en: 'Too much time lost' }) + '</h1></div></div>' +
    '<p class="story">' + L(pass
      ? (first === SCENES.length ? { ar: 'أداء نموذجي في المسار من أول قرار لآخره. المريضان وصلا للعلاج في الوقت.', en: 'A textbook run of the pathway from first call to last. Both patients reached treatment in time.' } : { ar: 'المريضان وصلا للعلاج، مع نقاط تستحق المراجعة بالأسفل.', en: 'Both patients reached treatment, with points worth reviewing below.' })
      : { ar: 'التأخير في القرارات كلّف عضلة قلب كثيرة. راجع النقاط بالأسفل والعب مرة ثانية.', en: 'Delays cost a lot of heart muscle. Review the points below and play again.' }) + '</p>' +
    '<div class="score">' +
      '<div><b>' + myo() + '%</b><span>' + L({ ar: 'عضلة القلب المُنقَذة (60% أو أكثر للنجاح)', en: 'myocardium saved (60% or more to pass)' }) + '</span></div>' +
      '<div><b>' + first + '/' + SCENES.length + '</b><span>' + L({ ar: 'قرارات صحيحة من أول مرة', en: 'decisions right on the first call' }) + '</span></div>' +
      '<div><b>+' + S.pen + '</b><span>' + L({ ar: 'دقيقة ضاعت في قرارات خاطئة', en: 'minutes lost to wrong calls' }) + '</span></div>' +
    '</div>' +
    '<ul class="review">' + SCENES.map((sc, k) => '<li><span>' + (k + 1) + '. ' + L(sc.title) + '</span><span class="' + (S.res[k] ? 'n' : 'y') + '">' + (S.res[k] ? UI.wrongN[LANG](S.res[k]) : L(UI.firstCall)) + '</span></li>').join('') + '</ul>' +
    '<button class="go" id="againBtn" type="button">' + L(UI.again) + '</button>' +
    '<p class="note">' + L({ ar: 'مبنية على سير عمل RCC لمسار STEMI في تجمع جازان الصحي وتوصيات AHA/ESC. للتدريب فقط، والقرار السريري حسب البروتوكول المعتمد واستشاري RCC.', en: 'Based on the Jazan Health Cluster RCC STEMI workflow and AHA/ESC guidance. For training only; clinical decisions follow the approved protocol and the RCC consultant.' }) + '</p>';
  $('againBtn').onclick = () => {
    Object.assign(S, { i: -1, pen: 0, res: [], log: [], ms: {}, pt: 0, t: null, v: null, ecg: null, node: null, lysis: 0 });
    drawLog(); setClock(null); drawMon(); drawFlow(); intro();
  };
}

/* Language: flips direction and redraws whatever is on screen without losing progress */
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = LANG === 'ar' ? 'لعبة مسار STEMI' : 'STEMI Pathway Game';
  $('langBtn').textContent = LANG === 'ar' ? 'English' : 'العربية';
  $('ecg').setAttribute('aria-label', L({ ar: 'تخطيط القلب', en: 'ECG' }));
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = L(UI[el.dataset.t]); });
  setClock(S.t); drawMon(); drawFlow(); drawLog();
  if (S.view === 'intro') intro();
  else if (S.view === 'ask') ask(S.i);
  else if (S.view === 'pick') pick(S.i, S.k, true);
  else finish();
}
$('langBtn').onclick = () => {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('stemi-lang', LANG); } catch (e) {}
  applyLang();
};
applyLang();
</script>
